
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Jay Music Gallery</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h2>🎵 Jay Music Gallery</h2>
        <nav>
            <a href="#home">首頁</a>
            <a href="#albums">專輯介紹</a>
            <a href="#songs">歌曲介紹</a>
        </nav>
    </header>

    <main id="home">
        <h1>探索周杰倫的音樂世界</h1>
        <p>從經典專輯到代表歌曲，認識不同時期的音樂特色。</p>

        <section id="albums" class="card">
            <h2>💿 精選專輯</h2>
            <p>范特西｜葉惠美｜七里香</p>
        </section>

        
<section id="songs" class="card">
    <h2>🎧 歌曲搜尋</h2>
    <p>輸入歌曲名稱，探索周杰倫的音樂作品。</p>

    <input
        type="text"
        id="searchInput"
        placeholder="例如：晴天、七里香、簡單愛"
    >

    <button id="searchButton">搜尋歌曲</button>

    <div id="searchResult"></div>
</section>

    </main>

    <footer>
        <p>Jay Music Gallery｜非官方音樂介紹網站</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
